# 将本文件复制为启动目录下的 server.toml。
# 后端只读取进程当前工作目录中的 ./server.toml。

[server]
# 可选，默认 0.0.0.0，监听所有网卡；仅本机访问可改为 "127.0.0.1"。
host = "0.0.0.0"
# 可选，默认 3000。
port = 3000
# 必填：自建 OIDC issuer。启动时请求 {issuer}/.well-known/openid-configuration
# 发现并拉取 JWKS，因此启动时必须能访问该地址。
oidc_issuer = "https://oidc.example.com"
# 必填：可接受的 token 受众（aud）。IdP 按 RFC 9068 签发 JWT access token，
# aud 取自客户端请求的 resource（RFC 8707），因此这里填资源标识本身。
oidc_audiences = ["https://logs.example.com"]
# 可选：token 必须携带的 scope；留空则不检查。用来做细粒度授权。
oidc_required_scopes = ["logs:read"]
# 仅接受 EdDSA(Ed25519) 签名、iss 与 issuer 一致的 token；
# 遇到未知 kid 自动重新拉取 JWKS（30 秒内最多一次），无需重启即可容忍密钥轮换。

# Storage 定义日志后端的连接和凭证，名称由使用者自定义。
# 当前默认启用 Elasticsearch。
[storages.es]
provider = "elasticsearch"
base_url = "http://127.0.0.1:9200"

# 阿里云 SLS 示例。使用时取消整段注释，并把 service 的 storage 改为 "sls"。
# [storages.sls]
# provider = "aliyun-sls"
# endpoint = "https://cn-hangzhou.log.aliyuncs.com"
# project = "your-project"
# access_key_id = { env = "SLS_ACCESS_KEY_ID" } # 也可直接写 "your-access-key-id"
# access_key_secret = { env = "SLS_ACCESS_KEY_SECRET" }
# 使用 STS 时再配置 security_token；凭证同样支持字符串或环境变量。
# security_token = { env = "SLS_SECURITY_TOKEN" }

# 火山云 TLS 预留配置，当前尚不支持，不能启用。
# [storages.bjv]
# provider = "volces-tls"
# region = "cn-beijing"
# topic_id = "your-topic-id"
# access_key_id = { env = "TLS_BJV_ACCESS_KEY_ID" }
# access_key_secret = { env = "TLS_BJV_ACCESS_KEY_SECRET" }

# Service 是搜索入口，例如 POST /foo/_search。
[services.foo]
# 必填：引用某个 storage 的名称。
storage = "es"
# 必填：实际 ES 索引或 SLS Logstore。
index = "app-logs"

# 可选：预置全文查询关键词；配置后优先于请求中的 keywords。
# keyword = "connection timeout"

# 默认自动将合法的 JSON 对象/数组字符串解析为 JSON；配置非空列表后只解析指定路径。
# 支持用双引号包裹包含点号的嵌套字段名；缺失字段和无效 JSON 保持原样。
# json_fields = ["attribute", "resource", "attribute.\"kv.legacy\""]

# 可选：JSON 解析后，按同一路径规则删除字段；缺失路径和数组保持原样。
# ignores = ["__pack_meta__", "attribute.\"thread.name\"", "attribute.\"kv.legacy\".body"]

# lookups 目前仅展示配置概念，不会执行关联查询。
# lookups = ["bar"]

# 可选：预置等值过滤条件，支持字符串、数字和布尔值。
# 与请求 filter 合并时，同名字段以这里的预置值为准。
# [services.foo.filters]
# service = "order"
# environment = "pre"
# attempt = 2
# retryable = true

# 多个 service 可以复用同一 storage，也可以指向不同 storage。
# [services.bar]
# storage = "sls"
# index = "app-logs"
